# 变异体清单：三个"人写得出来的"真实缺陷，各自绑定应该抓住它的用例。
#
# 选择标准（不是随机翻转）：
#   1. 形态真实 —— 注释校验、放宽边界、去掉守卫，都是 PR 里出现过的写法
#   2. 可归责 —— 注入后 baseline..HEAD 的改动集能指向本次改动，用于验证分类器 S2 判据
#   3. 可观测 —— 必须证明"改写后行为真的变了"。等价变异体不能算作断言缺口的证据
#
# 第 3 条是踩出来的（见 docs/mutation-equivalence.md）：
#   最初的 M2（放宽 SalesOrderAllocation 超分配）与 M3（短路工单结单守卫）都被判"存活"，
#   但读代码后发现它们**等价**——
#     * order/models.py:3286 放宽后，order/models.py:3303 的 total_allocation 守卫仍然拦截；
#     * build/models.py:1033 短路后，build/serializers.py:799 的
#       'Build order has incomplete outputs' 仍然拦截。
#   等价变异体存活只说明"变异没改变行为"，不说明"用例没断言"。把这两条当作断言缺口上报，
#   就是把工具的无能粉饰成代码的问题。所以两个变异体都重挑，换成没有第二道守卫兜底的锚点。

version: 1

mutations:
  - id: M1-bom-self-reference
    file: src/backend/InvenTree/part/models.py
    find: "self.sub_part.check_add_to_bom(self.part, raise_error=True)"
    replace: "pass  # MUTANT: circular BOM check disabled"
    rationale: >
      为了让某个报错的用例先过去，直接把循环 BOM 校验注释掉。
      这是"绕过校验换绿灯"的典型形态，也是自引用脏数据进入 BOM 的唯一入口。
    expect_killed_by:
      - part.test_bom_item.BomItemTest.test_self_reference

  - id: M2-trackable-fractional-quantity
    file: src/backend/InvenTree/part/models.py
    find: "if self.quantity != int(self.quantity):"
    replace: "if False:  # MUTANT: fractional quantity on trackable parts tolerated"
    rationale: >
      去掉"可追溯件的 BOM 用量必须是整数"这一条。
      线上表现：可追溯件被按 21.7 个领用，序列号无法与用量对齐，
      下游工单产出与库存账永远差一个小数。
      该守卫在本仓没有第二道兜底（serializer 不做整数校验），因此可观测。
    expect_killed_by:
      - part.test_bom_item.BomItemTest.test_integer_quantity

  - id: M3-order-reference-pattern
    file: src/backend/InvenTree/InvenTree/models.py
    find: "if not InvenTree.format.validate_string(value, pattern):"
    replace: "if False:  # MUTANT: reference pattern validation disabled"
    rationale: >
      关掉订单编号的模式校验。这是所有单据（SO/PO/BO…）共用的唯一守卫，
      一旦失效，任意字符串都能成为编号，编号前缀契约（SO-/PO-/BO-）与排序全部作废，
      且前端与报表的按前缀解析会静默错位——账面上一切正常。
    expect_killed_by:
      - order.test_api.SalesOrderTest.test_so_create
