# 被测对象声明（Target Descriptor）
# 唯一作用：把"测谁、哪个提交、怎么起"从用例里剥离出来。
# 任何一次运行都必须与 schema_version 中的 commit 一致，否则 4.gates 拒跑。

target:
  name: InvenTree
  repo: https://github.com/inventree/InvenTree
  commit: d96174cddbc2566fea53b3fe39b5d4aa5d30fbf1
  commit_date: 2026-10-30
  observed_at: 2026-10-31
  license: MIT
  domain: 电子元件 / BOM / 库存 / 生产工单（PCB 装配链）
  domain_note: >
    这是 PCB 制造侧（BOM/物料/工单）的全栈系统，不是原理图编辑器。
    报告首页必须如实标注，不得冒充 EDA 前端。

  separation:
    backend_path: src/backend/InvenTree
    frontend_path: src/frontend
    contract: Django REST Framework + drf-spectacular OpenAPI
    evidence: >
      前端为独立 TypeScript 工程（package.json: @inventreedb/ui, vite 构建），
      通过 lib/enums/ApiEndpoints.tsx 声明式引用后端路由；
      后端不含前端模板渲染业务页面（templates 仅用于 PDF/报表输出）。

  stack:
    backend: Django 5.2.17 + DRF 3.18.3 (Python 3.13.12)
    frontend: React + TypeScript + Vite
    db_default: sqlite3 (支持 postgresql/mysql)

  measured:
    method: clone --depth 1 + 逐文件计数（排除 .git/node_modules/docs/assets）
    total_source_lines: 275140
    python_lines: 176773
    typescript_lines: 97175
    source_files: 1304
    upstream_test_files: 92
    upstream_test_functions: 1886

runtime:
  python: C:/Users/Administrator/.workbuddy/binaries/python/envs/inventree/Scripts/python.exe
  workdir: D:/wbeval/repos/inventree/src/backend/InvenTree
  sut_root: D:/wbeval/repos/inventree
  env:
    INVENTREE_DB_ENGINE: sqlite3
    INVENTREE_DB_NAME: D:/wbeval/it_dev.sqlite3
    INVENTREE_STATIC_ROOT: D:/wbeval/it_static
    INVENTREE_MEDIA_ROOT: D:/wbeval/it_media
    INVENTREE_BACKUP_DIR: D:/wbeval/it_backup
    INVENTREE_SITE_URL: http://localhost:8000
  secret:
    INVENTREE_SECRET_KEY: 本地一次性测试密钥，不进入仓（见 .gitignore / 运行注入）

  # 依赖塌缩声明：被替身化的"别人的东西"，必须写清边界与失效方式
  virtualization:
    - package: weasyprint
      kind: native-library
      reason: >
        本机无 GTK3（libgobject-2.0-0），而上游 report/models.py 在 import 期
        捕获 OSError 后直接 sys.exit(1)，不替换则整套 Django 无法启动。
      scope: 仅满足导入期依赖；HTML(...)/write_pdf() 一律抛 RuntimeError
      fail_loudly: true
      path: 3.env/virtual/weasyprint
      # 失败文本里可能只出现"渲染报表失败"而不出现 weasyprint，故显式声明可命中的串
      match_message:
        - "weasyprint"
        - "Error rendering report"
        - "Error rendering label"
        - "Error generating report"
      excluded_tests:
        - report.test_tags
        - report.tests
      excluded_reason: PDF 渲染依赖被虚拟化，相关断言在本环境不成立

  database_note: >
    使用 sqlite3 而非上游 CI 的 postgresql。原因是本机 Docker daemon 未运行、无独立 PG 实例。
    该替换只影响并发与 JSON 字段实现细节，不影响本次冒烟的业务语义；
    差异已记入 evidence/runs 的 environment 字段。

  # 环境偏差声明（Environment Deviations）
  #
  # 这里的每一条都必须能用一条可复算的探针验证，且只能用来解释"失败信息自己指认了
  # 缺失的前置条件"的失败。分类器 S0 规则完全由本段驱动——不允许在代码里硬编码例外。
  #
  # 判据纪律：
  #   match_message  —— 失败文本本身出现该串，即视为该前置条件缺失（自证）
  #   match_test_prefix —— 仅当整个模块就是该前置条件的符合性套件时使用（需写明理由）
  # 两条都不命中的失败，一律留在 unknown 进隔离区，不许强行归因。
  environment_deviations:
    - id: windows-path-separator
      change: 上游 CI 在 Linux 上运行，本机为 Windows
      probe: >
        用例里 assertTrue(any(opt in str(path).lower() for opt in ['config/config.yaml', ...]))，
        在 Windows 下 str(path) 为反斜杠形式，正斜杠字面量永远不命中
      match_message:
        - "not in ['config/"
      affected: ["InvenTree.tests.TestSettings"]

    - id: translations-not-compiled
      change: 未执行 compilemessages，仓内 0 个 .mo 文件（只有 .po）
      probe: find src/backend/InvenTree/locale -name "*.mo" | wc -l  →  0
      match_message:
        - "Elemento ricevuto"
      affected: ["common.test_notifications.NotificationLocaleTest"]

    - id: sample-plugins-not-installed
      change: 未安装上游的 sample plugins（上游 CI 会 collect 一批 plugin.samples）
      probe: >
        registry.reload_plugins() 后 registry.plugins 为 11 个内置插件：
        bom-exporter / inventree-* / inventreebarcode / inventreelabel / parameter-exporter，
        其中 0 个来自 plugin.samples
      match_message:
        - "plugin.samples"
      match_test_prefix:
        - "plugin.samples."
      prefix_reason: >
        这些用例本身就是 sample plugin 的符合性套件，脱离 sample plugins 不存在
        可检验的对象；前缀匹配等价于"该套件的前置依赖缺失"。
      affected: ["plugin.samples.*"]

    - id: network-egress-restricted
      change: 本机对公网的部分出站受限，用例中的真实远端请求不可达
      probe: 失败文本携带 HTTPSConnectionPool / Connection error 与具体主机名
      match_message:
        - "HTTPSConnectionPool"
        - "Connection error:"
      affected: ["InvenTree.tests.TestHelpers.test_download_image"]

    - id: windows-file-lock
      change: Windows 对被打开文件加写锁，Linux 不锁
      probe: 失败文本携带 WinError 32（另一个程序正在使用此文件）
      match_message:
        - "WinError 32"
      affected: ["common.test_audit.AttachmentAuditTest"]

